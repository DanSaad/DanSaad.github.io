<!-- The Top Bar with Navigation Tabs - Clean Single Column -->

<header id="topbar-wrapper" class="flex-shrink-0" aria-label="Top Bar" style="background: var(--bg-color); border-bottom: 1px solid var(--border-color);">
  <div id="topbar" class="d-flex align-items-center justify-content-between px-3 px-md-4 py-2" style="max-width: 1200px; margin: 0 auto; width: 100%;">
    <!-- Navigation Tabs - Full Width on Desktop, Stacked on Mobile -->
    <nav id="top-nav" class="d-flex flex-grow-1" aria-label="Main Navigation">
      <ul class="nav nav-fill w-100 mb-0" style="border-bottom: none;">
        {% for tab in site.tabs %}
          <li class="nav-item flex-fill text-center">
            <a
              href="{{ tab.url | relative_url }}"
              class="nav-link px-2 px-md-3 py-2 {% if tab.url == page.url or (tab.url != '/' and page.url contains tab.url) %}active{% endif %}"
              style="color: var(--text-color); border-radius: 0.375rem; border: none; background: transparent; transition: all 0.2s ease; white-space: nowrap;"
            >
              {% if tab.icon %}<i class="fa-fw {{ tab.icon }}"></i> {% endif %}
              <span>{{ tab.title }}</span>
            </a>
          </li>
        {% endfor %}
      </ul>
    </nav>

    <!-- Search - Compact, only on larger screens -->
	{% if site.chirpy.search.enable %}
    <div id="search-wrapper" class="d-none d-lg-flex ms-3">
      <search id="search" class="align-items-center">
        <i class="fas fa-search fa-fw text-muted"></i>
        <input
          class="form-control form-control-sm"
          id="search-input"
          type="search"
          aria-label="search"
          autocomplete="off"
          placeholder="{{ site.data.locales[include.lang].search.hint | capitalize }}..."
          style="width: 200px; background: var(--card-bg); border: 1px solid var(--border-color);"
        >
      </search>
    </div>
     {% endif %}
  </div>
</header>

<style>
  /* Override Chirpy theme's container/row/col defaults */
  .single-column-layout #main-wrapper {
    display: block !important;
    width: 100% !important;
    max-width: 100% !important;
    padding: 0 !important;
    margin: 0 !important;
  }
  
  .single-column-layout .page-container {
    width: 100% !important;
    max-width: 100% !important;
    padding: 0 1rem !important;
    margin: 0 !important;
    box-sizing: border-box;
  }
  
  .single-column-layout .page-content {
    width: 100% !important;
    max-width: 900px !important;
    margin: 0 auto !important;
    padding: 2rem 0 !important;
    box-sizing: border-box;
  }
  
  .single-column-layout .page-footer {
    width: 100% !important;
    max-width: 900px !important;
    margin: 0 auto !important;
    padding: 2rem 0 !important;
    border-top: 1px solid var(--border-color);
    box-sizing: border-box;
    text-align: center;
  }
  
  /* Kill Bootstrap row/col margins/paddings in our layout */
  .single-column-layout .row,
  .single-column-layout .container,
  .single-column-layout .container-fluid {
    margin: 0 !important;
    padding: 0 !important;
    max-width: 100% !important;
    width: 100% !important;
  }
  
  .single-column-layout [class*="col-"] {
    padding: 0 !important;
    margin: 0 !important;
    width: 100% !important;
    max-width: 100% !important;
    flex: 0 0 100% !important;
  }
  
  /* Navigation tabs */
#top-nav .nav-link {white-space: nowrap;}

/* Mobile scroll */
@media (max-width: 767px) {
  #top-nav .nav {overflow-x:auto; white-space:nowrap;}
}
  #top-nav .nav-link:hover {
    color: var(--theme-color);
    background: var(--btn-bg);
  }
  
  #top-nav .nav-link.active {
    color: var(--theme-color);
    background: var(--btn-bg);
    font-weight: 600;
  }
  
  /* Mobile: tabs scroll horizontally */
  @media (max-width: 767px) {
    #topbar {
      padding: 0.5rem 1rem;
    }
    #top-nav .nav {
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    #top-nav .nav-item {
      flex: 0 0 auto;
    }
    #top-nav .nav-link {
      padding: 0.5rem 1rem;
      border-radius: 0.25rem;
      margin: 0 0.25rem;
    }
  }
  
  /* Ensure content uses full viewport width on large screens */
  @media (min-width: 1200px) {
    .single-column-layout .page-container {
      max-width: 100% !important;
      padding: 0 2rem !important;
    }
  }
</style>
